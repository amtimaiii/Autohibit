<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>習慣循環實驗室</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#93c9ec">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcf9ea;--card:#fffef9;--ink:#34404f;--mute:#6b7685;--line:#e6e8d8;--acc:#93c9ec;--acc-ink:#12304a;--hit:#86600a;--hit-bg:#fff0b5;--bad:#c9506a;--lav:#9ad8c1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(160deg,#fffbe0 0%,#f1f7fd 55%,#e9f5fc 100%) fixed,var(--bg);color:var(--ink);font:16px/1.7 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 64px}
h1{font:700 26px/1.3 "Noto Serif TC",serif;margin:8px 0 4px}
h2{font:700 20px/1.4 "Noto Serif TC",serif;margin:0 0 6px}
h3{font-size:16px;margin:20px 0 6px}
p{margin:6px 0}.sub{color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;margin:16px 0;overflow-x:auto;padding-bottom:4px}
nav button{flex:1 0 auto;min-width:78px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;cursor:pointer;line-height:1.3}
nav button b{display:block;color:var(--ink);font-size:15px}
nav button[aria-selected="true"]{border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
section{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
section.on{display:block}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);padding:10px 16px;cursor:pointer;margin-top:14px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.timer{text-align:center;border:1px solid var(--acc);border-radius:12px;padding:16px;margin-top:16px}
.timer .t{font:700 44px/1.2 "Noto Serif TC",serif;font-variant-numeric:tabular-nums}
.item{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.item:first-child{border-top:0}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:12px;font-weight:600}
.gone{background:var(--hit-bg);color:var(--hit)}.still{background:var(--line);color:var(--mute)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar.top i{background:#f1cc5f}
.callout{background:var(--hit-bg);border-left:4px solid #f1cc5f;border-radius:6px;padding:10px 12px;margin:12px 0;font-size:14px}
.plan{font:600 18px/1.8 "Noto Serif TC",serif;border:2px dashed var(--acc);border-radius:12px;padding:14px;margin-top:16px}
.del{float:right;border:0;background:none;color:var(--mute);cursor:pointer;font-size:13px}
.top-tools{display:flex;justify-content:space-between;align-items:center}
.top-tools button{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.hint{font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
#habits{margin:0 0 4px}
.chip.add{border-style:dashed;color:var(--mute)}
.ov{font-size:14px;border-top:1px solid var(--line);padding:8px 0}
.hero{display:flex;align-items:center;gap:16px;margin:10px 0 14px;padding:18px 18px 18px 22px;border:1px solid var(--line);border-left:5px solid #f1cc5f;border-radius:14px;background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px),var(--card)}
.hero svg{flex:none}
.hero h1{margin:0;font-size:30px;line-height:1.25;letter-spacing:.14em}
.hero .rule{display:flex;gap:5px;margin:8px 0 6px}
.hero .rule i{width:22px;height:4px;border-radius:2px}
.hero .tag{margin:0;font-size:13px;color:var(--mute);letter-spacing:.05em}
@media (max-width:420px){.hero h1{font-size:25px;letter-spacing:.1em}.hero svg{width:48px;height:48px}}
[hidden]{display:none!important}
.wrap{position:fixed;inset:0;background:rgba(40,35,10,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.box{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%;border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:9px 16px;border-radius:99px;font-size:14px;z-index:10;max-width:90%}
</style>
</head>
<body>
<div class="wrap" id="ask" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="askT"><h2 id="askT"></h2><p id="askB"></p><input id="askIn" autocomplete="off" aria-label="確認文字"><div><button class="btn danger" id="askOk" disabled>確認</button> <button class="btn ghost" id="askNo">取消</button></div></div></div>
<div id="toast" hidden></div>
<main>
<div class="top-tools"><span class="sub">資料只存在這個瀏覽器</span><button id="reset">清除全部資料</button></div>
<header class="hero"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><path d="M37.3 10.7A22 22 0 0 1 53.9 34.3" fill="none" stroke="var(--acc)" stroke-width="4" stroke-linecap="round"/><polygon points="53.1,41.3 58.9,34.8 48.9,33.8" fill="var(--acc)"/><path d="M47.8 47.3A22 22 0 0 1 19.1 49.8" fill="none" stroke="#f1cc5f" stroke-width="4" stroke-linecap="round"/><polygon points="13.4,45.7 16.1,53.8 22.0,45.8" fill="#f1cc5f"/><path d="M10.9 38.1A22 22 0 0 1 23.1 11.9" fill="none" stroke="var(--lav)" stroke-width="4" stroke-linecap="round"/><polygon points="29.4,9.1 21.0,7.3 25.1,16.5" fill="var(--lav)"/><circle cx="32" cy="32" r="3.5" fill="var(--lav)"/></svg>
<div><h1>習慣循環實驗室</h1><div class="rule"><i style="background:var(--acc)"></i><i style="background:#f1cc5f"></i><i style="background:var(--lav)"></i></div><p class="tag">提示、行為、獎勵:找出習慣背後真正的渴求</p></div></header>
<div id="habits" class="chips" role="group" aria-label="切換習慣"></div>
<nav id="tabs" role="tablist"></nav>

<section id="s0">
<h2>認出慣性行為</h2>
<p class="sub">選一個想弄懂的習慣,越具體越好,例如「下午三點走去咖啡館買餅乾」。</p>
<label for="habit">這個習慣是什麼?</label>
<input id="habit" placeholder="例:下午離開座位去買餅乾">
<label for="routine">它通常怎麼發生?</label>
<textarea id="routine" placeholder="例:工作到一半站起來,走到咖啡館,買餅乾,邊走邊吃,回到座位"></textarea>
<label for="guess">你猜自己渴求的是什麼?</label>
<div class="chips" id="guessChips"></div>
<input id="guess" placeholder="先猜,實驗會驗證你猜得準不準" style="margin-top:8px">
<button class="btn" data-go="1">下一步:開始記錄</button> <button class="btn ghost" id="delHabit">刪除這個習慣</button>
<h3>所有習慣總覽</h3><div id="ov"></div>
</section>

<section id="s1">
<div id="active"></div>
<div id="newRec">
<h2>衝動出現了</h2>
<p class="sub">先別行動,花 30 秒填這張卡,再去做今天要測試的獎勵。</p>
<label>現在多想做那個習慣?(1 完全不想,5 非常想)</label>
<div class="chips" id="bef"></div>
<label for="cPlace">你在哪裡?</label>
<input id="cPlace" placeholder="例:辦公桌"><div class="chips" data-for="cPlace"></div>
<label for="cTime">現在幾點?</label>
<input id="cTime" type="time">
<label for="cMood">情緒狀態?</label>
<input id="cMood" placeholder="例:無聊"><div class="chips" data-for="cMood"></div>
<label for="cWho">周圍有誰?</label>
<input id="cWho" placeholder="例:一個人"><div class="chips" data-for="cWho"></div>
<label for="cPrev">緊接在衝動之前,你剛做了什麼?</label>
<input id="cPrev" placeholder="例:開完會"><div class="chips" data-for="cPrev"></div>
<label>今天要測試哪種獎勵?</label>
<div class="chips" id="rewChips"></div>
<input id="rewCustom" placeholder="或自己輸入獎勵" style="margin-top:8px">
<p class="hint" id="rewHint"></p>
<button class="btn" id="startRec">記好了,去執行獎勵</button>
</div>
</section>

<section id="s2">
<h2>回顧</h2>
<div id="rev"></div>
</section>

<section id="s3">
<h2>訂定計畫</h2>
<p class="sub">保留同樣的提示和獎勵,只換掉中間的行為。</p>
<div id="planAuto"></div>
<label for="pCue">當(提示)</label>
<input id="pCue" placeholder="例:下午三點,我在辦公桌前感到無聊">
<label for="pAct">我就(新的行為)</label>
<input id="pAct" placeholder="例:走到同事桌旁聊五分鐘">
<label for="pRew">為了得到(獎勵)</label>
<input id="pRew" placeholder="例:和人接觸、暫停工作">
<div class="plan" id="planOut"></div>
<button class="btn" id="copyPlan">複製計畫</button>
<p class="hint">新行為沒用的話,回到記錄頁,用新的獎勵再試一輪。</p>
</section>
</main>

<script>
const K='habitLoop.v2';
const newHabit=(n='')=>({id:Date.now()+Math.random(),habit:n,routine:'',guess:'',recs:[],plan:{cue:'',act:'',reward:''},run:null});
let ALL={cur:null,list:[]};
try{const o=JSON.parse(localStorage.getItem(K)||'null');
 if(o&&o.list)ALL=o;
 else if(o){const h=newHabit();Object.assign(h,o);ALL={cur:h.id,list:[h]}}
 else{const v1=JSON.parse(localStorage.getItem('habitLoop.v1')||'{}'),h=newHabit();['habit','routine','guess','plan'].forEach(k=>{if(v1[k])h[k]=v1[k]});ALL={cur:h.id,list:[h]}}}catch(e){}
if(!ALL.list.length){const h=newHabit();ALL={cur:h.id,list:[h]}}
let S=ALL.list.find(h=>h.id===ALL.cur)||ALL.list[0];ALL.cur=S.id;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(ALL))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DUR=15*60*1000;
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}
let askFn=null,askNeed='';
function ask(o){askFn=o.onOk;askNeed=o.need;$('askT').textContent=o.title;$('askB').textContent=o.body+' 請在下方輸入「'+o.need+'」後確認。';$('askOk').textContent=o.ok;$('askIn').value='';$('askOk').disabled=true;$('ask').hidden=false;setTimeout(()=>$('askIn').focus(),30)}
$('askIn').oninput=()=>{$('askOk').disabled=$('askIn').value.trim()!==askNeed};
$('askNo').onclick=()=>{$('ask').hidden=true;askFn=null};
$('askOk').onclick=()=>{if($('askIn').value.trim()!==askNeed)return;$('ask').hidden=true;const f=askFn;askFn=null;f&&f()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('askNo').onclick()});
const REW=[
 {n:'散步一圈,不吃東西',h:'測試:你要的只是暫停工作、休息一下?'},
 {n:'買甜甜圈或巧克力棒,回座位吃',h:'測試:你要的是糖分或食物本身?'},
 {n:'買蘋果,邊跟朋友聊邊吃',h:'測試:你是真的餓了?(蘋果也能滿足的話)'},
 {n:'喝杯咖啡',h:'測試:你要的是提振精神?'},
 {n:'走到朋友桌旁聊幾分鐘',h:'測試:你要的是社交,餅乾只是藉口?'}];
const GUESS=['想暫停工作休息','想提振精神','想逃避無聊'];
const PRE={cPlace:['辦公桌','客廳','廚房','走廊'],cMood:['無聊','疲倦','焦慮','壓力','開心','空虛'],cWho:['一個人','同事','家人','朋友'],cPrev:['開完會','做完一件事','滑手機','剛吃完飯','被打斷']};
const CAT=[['place','地點'],['time','時間'],['mood','情緒'],['who','其他人'],['prev','緊接的行為']];
const TABS=['認出習慣','記錄','回顧','訂定計畫'];
let tab=0,sel='',bef=0,aft=0;

function show(i){tab=i;document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',j===i));drawTabs();window.scrollTo(0,0)}
function drawTabs(){
 const meta=[S.habit?'已填':'未填',S.recs.filter(r=>r.result).length+' 筆',S.recs.length?'看結果':'—',S.plan.act?'已寫':'未寫'];
 $('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" aria-selected="${i===tab}" data-t="${i}"><b>${t}</b>${meta[i]}</button>`).join('');
}
$('tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){show(+b.dataset.t);render()}};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){show(+g.dataset.go);render()}});

['habit','routine','guess'].forEach(k=>{$(k).value=S[k]||'';$(k).oninput=()=>{S[k]=$(k).value;save();drawTabs();drawHabits()}});
$('guessChips').innerHTML=GUESS.map(g=>`<button class="chip" data-g="${g}">${g}</button>`).join('');
$('guessChips').onclick=e=>{const b=e.target.closest('[data-g]');if(b){$('guess').value=b.dataset.g;S.guess=b.dataset.g;save()}};

function scale(id,cur){return [1,2,3,4,5].map(n=>`<button class="chip" aria-pressed="${cur===n}" data-n="${n}">${n}</button>`).join('')}
function drawBef(){$('bef').innerHTML=scale('bef',bef)}
$('bef').onclick=e=>{const b=e.target.closest('[data-n]');if(b){bef=+b.dataset.n;drawBef()}};
const FIELD={cPlace:'place',cMood:'mood',cWho:'who',cPrev:'prev'};
const recent=k=>[...new Set(S.recs.map(r=>r[k]).filter(Boolean))].slice(0,3);
function drawPre(){document.querySelectorAll('.chips[data-for]').forEach(c=>{
 c.innerHTML=recent(FIELD[c.dataset.for]).map(p=>`<button class="chip" data-v="${esc(p)}">${esc(p)}</button>`).join('');
 c.onclick=e=>{const b=e.target.closest('[data-v]');if(b)$(c.dataset.for).value=b.dataset.v};
})}
function nowTime(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
$('cTime').value=nowTime();
function drawRewChips(){
 const rs=recent('reward'),list=rs.length?rs:REW.map(r=>r.n);
 $('rewChips').innerHTML=list.map(n=>`<button class="chip" aria-pressed="${sel===n}" data-r="${esc(n)}">${esc(n)}</button>`).join('');
 const r=REW.find(x=>x.n===sel);$('rewHint').textContent=r?r.h:'';
}
$('rewChips').onclick=e=>{const b=e.target.closest('[data-r]');if(b){sel=b.dataset.r;$('rewCustom').value='';drawRewChips()}};
$('rewCustom').oninput=()=>{if($('rewCustom').value){sel='';drawRewChips()}};

$('startRec').onclick=()=>{
 if(S.run){toast('還有一筆記錄進行中,請先完成。');return}
 const reward=$('rewCustom').value.trim()||sel;
 if(!bef){toast('請先選現在的渴求強度。');return}
 if(!reward){toast('請選一種要測試的獎勵。');return}
 const r={id:Date.now(),created:Date.now(),place:$('cPlace').value.trim(),time:$('cTime').value,mood:$('cMood').value.trim(),who:$('cWho').value.trim(),prev:$('cPrev').value.trim(),reward,before:bef,words:[],t1:0,after:0,result:null};
 S.recs.unshift(r);S.run=r.id;save();
 ['cPlace','cMood','cWho','cPrev','rewCustom'].forEach(k=>$(k).value='');$('cTime').value=nowTime();bef=0;sel='';aft=0;
 drawBef();drawRewChips();render();window.scrollTo(0,0);
};

const run=()=>S.recs.find(r=>r.id===S.run);
let akey='';
function drawActive(){
 const r=run(),box=$('active');
 $('newRec').style.display=r?'none':'block';
 if(!r){box.innerHTML='';akey='';return}
 if(!r.t1){
  if(akey!=='back'){akey='back';box.innerHTML=`<h2>去執行獎勵</h2><p><b>${esc(r.reward)}</b></p><p class="sub">做完、回到座位後,寫下最先想到的三件事(情緒、隨機的事、單字都行)。</p>
  <div class="row3"><input id="w0" aria-label="第一件事"><input id="w1" aria-label="第二件事"><input id="w2" aria-label="第三件事"></div>
  <button class="btn" id="go15">寫好了,開始 15 分鐘計時</button> <button class="btn ghost" data-a="cancel">取消這筆</button>`}
  return;
 }
 const left=Math.max(0,r.t1+DUR-Date.now()),done=left===0;
 const m=String(Math.floor(left/60000)).padStart(2,'0'),s=String(Math.floor(left%60000/1000)).padStart(2,'0');
 const k='t'+done;
 if(akey===k){box.querySelector('.t').textContent=m+':'+s;return}
 akey=k;
 box.innerHTML=`<div class="timer"><p class="sub">${esc(r.reward)}(開始前強度 ${r.before})</p><div class="t">${m}:${s}</div>
 ${done?`<p>時間到。現在還有多想做那個習慣?</p><div class="chips" id="aft" style="justify-content:center">${scale('aft',aft)}</div><p class="hint">1 完全不想,5 非常想。1~2 算「渴求消失」。</p><button class="btn" id="fin">完成這筆記錄</button>`:'<p>先回去工作,時間到了再回答。</p>'}
 <br><button class="btn ghost" data-a="cancel">取消這筆</button></div>`;
}
$('active').onclick=e=>{
 const r=run();if(!r)return;
 if(e.target.id==='go15'){r.words=[0,1,2].map(i=>$('w'+i).value.trim());r.t1=Date.now();save();akey='';render();return}
 const n=e.target.closest('[data-n]');if(n&&$('aft')){aft=+n.dataset.n;$('aft').innerHTML=scale('aft',aft);return}
 if(e.target.id==='fin'){if(!aft){toast('請先選現在的渴求強度。');return}r.after=aft;r.result=aft<=2?'gone':'still';S.run=null;aft=0;akey='';save();render();return}
 if(e.target.dataset.a==='cancel'){S.recs=S.recs.filter(x=>x.id!==r.id);S.run=null;akey='';save();render()}
};

// analysis
const val=(r,k)=>k==='time'?(r.time?r.time.slice(0,2)+':00 前後':''):r[k];
const doneRecs=()=>S.recs.filter(r=>r.result);
function byReward(){
 const m={};doneRecs().forEach(r=>{const x=m[r.reward]=m[r.reward]||{n:0,gone:0,drop:0};x.n++;x.drop+=r.before-r.after;if(r.result==='gone')x.gone++});
 return Object.entries(m).map(([k,v])=>({k,...v,avg:v.drop/v.n})).sort((a,b)=>b.gone/b.n-a.gone/a.n||b.avg-a.avg);
}
function goodRewards(){return byReward().filter(x=>x.gone===x.n).map(x=>x.k)}
function topCue(k){
 const d=doneRecs(),m={};d.forEach(r=>{const v=val(r,k);if(v)m[v]=(m[v]||0)+1});
 return {arr:Object.entries(m).sort((a,b)=>b[1]-a[1]),n:d.length};
}
function strongCues(){
 const out=[];CAT.forEach(([k,name])=>{const {arr,n}=topCue(k);if(arr.length&&arr[0][1]>=2&&arr[0][1]/n>=.6)out.push([name,arr[0][0],arr[0][1],n])});return out;
}
function drawRev(){
 const d=doneRecs(),n=d.length;
 if(!n){$('rev').innerHTML='<p class="sub">還沒有完成的記錄。到「記錄」頁填第一筆。</p>';return}
 let h=n<5?`<p class="sub">目前 ${n} 筆,先看趨勢。建議累積 5 筆以上,不同獎勵各試一次。</p>`:'';
 const br=byReward();
 h+='<h3>哪種獎勵讓渴求消失?</h3>'+br.map((x,i)=>`<div><b>${esc(x.k)}</b> <span class="sub">${x.gone}/${x.n} 次消失,平均降 ${x.avg.toFixed(1)} 分</span></div><div class="bar ${x.gone===x.n?'top':''}"><i style="width:${x.gone/x.n*100}%"></i></div>`).join('');
 const g=goodRewards();
 h+=g.length?`<div class="callout"><b>線索:</b>「${g.map(esc).join('」「')}」每次都讓渴求消失,你真正要的可能就是它背後的需求。再多試幾次確認。</div>`:'<div class="callout">還沒有獎勵穩定奏效。換個方向再試:休息、社交、提神、食物。</div>';
 const sc=strongCues();
 h+='<h3>哪些提示反覆出現?</h3>'+(sc.length?`<div class="callout"><b>疑似提示:</b>${sc.map(x=>`${x[0]}「${esc(x[1])}」(${x[2]}/${x[3]})`).join('、')}</div>`:'<p class="sub">還沒有類別明顯重複(出現超過六成才算)。</p>');
 CAT.forEach(([k,name])=>{const {arr}=topCue(k);if(!arr.length)return;h+=`<p style="margin-top:10px"><b>${name}</b></p>`+arr.slice(0,3).map(([a,b])=>`<div class="sub">${esc(a)}(${b}/${n})</div><div class="bar ${b>=2&&b/n>=.6?'top':''}"><i style="width:${b/n*100}%"></i></div>`).join('')});
 const cross=[];
 [['mood','情緒'],['prev','前一個行為'],['place','地點'],['who','其他人']].forEach(([k,name])=>{
  const vs=[...new Set(d.map(r=>r[k]).filter(Boolean))];
  vs.forEach(v=>{const rs=d.filter(r=>r[k]===v);if(rs.length<2)return;
   const ok=[...new Set(rs.filter(r=>r.result==='gone').map(r=>r.reward))].filter(rw=>rs.filter(r=>r.reward===rw).every(r=>r.result==='gone'));
   if(ok.length)cross.push(`${name}「${esc(v)}」時:${ok.map(esc).join('、')}有效`)});
 });
 if(cross.length)h+='<h3>情境配對</h3>'+cross.map(c=>`<div class="item">${c}</div>`).join('');
 const days={};S.recs.filter(r=>r.result).forEach(r=>{const dk=new Date(r.created).toLocaleDateString('zh-TW',{month:'numeric',day:'numeric',weekday:'short'});(days[dk]=days[dk]||[]).push(r)});
 h+='<h3>每日回顧</h3>'+Object.entries(days).map(([dk,rs])=>`<p><b>${dk}</b> <span class="sub">${rs.length} 筆</span></p>`+rs.map(r=>`<div class="item"><button class="del" data-del="${r.id}">刪除</button><span class="tag ${r.result}">${r.before}→${r.after}</span> <b>${esc(r.reward)}</b><div class="sub">${[r.place,r.time,r.mood,r.who,r.prev].filter(Boolean).map(esc).join(' ・ ')}${r.words.filter(Boolean).length?'<br>想到:'+r.words.filter(Boolean).map(esc).join('、'):''}</div></div>`).join('')).join('');
 $('rev').innerHTML=h;
}
$('rev').onclick=e=>{const b=e.target.closest('[data-del]');if(b){S.recs=S.recs.filter(x=>x.id!=b.dataset.del);save();render()}};

['pCue','pAct','pRew'].forEach((id,i)=>{const k=['cue','act','reward'][i];$(id).value=S.plan[k]||'';$(id).oninput=()=>{S.plan[k]=$(id).value;save();drawPlan();drawTabs()}});
function drawPlan(){
 const sc=strongCues(),g=goodRewards();
 $('planAuto').innerHTML=(sc.length||g.length)?`<div class="callout">分析結果:${sc.length?`提示可能是「${sc.map(x=>esc(x[1])).join('、')}」。`:''}${g.length?`有效的獎勵:「${g.map(esc).join('」「')}」。`:''}<br><button class="btn ghost" id="fill">帶入計畫欄位</button></div>`:'<p class="sub">累積幾筆記錄後,這裡會出現分析結果。</p>';
 const p=S.plan;$('planOut').textContent=`當 ${p.cue||'(提示)'},我就 ${p.act||'(新的行為)'},為了得到 ${p.reward||'(獎勵)'}。`;
}
$('planAuto').onclick=e=>{
 if(!e.target.closest('#fill'))return;const sc=strongCues(),g=goodRewards();
 if(sc.length){S.plan.cue=sc.map(x=>x[1]).join(',');$('pCue').value=S.plan.cue}
 if(g.length){S.plan.reward=g[0];$('pRew').value=g[0]}
 save();drawPlan();
};
$('copyPlan').onclick=async()=>{
 try{await navigator.clipboard.writeText($('planOut').textContent);$('copyPlan').textContent='已複製'}catch(e){$('copyPlan').textContent='請長按文字手動複製'}
 setTimeout(()=>$('copyPlan').textContent='複製計畫',1800);
};
$('reset').onclick=()=>ask({title:'清除全部資料',body:'將永久刪除所有習慣和記錄,無法復原。',need:'清除全部',ok:'全部清除',onOk:()=>{try{localStorage.removeItem(K);localStorage.removeItem('habitLoop.v1')}catch(e){}location.reload()}});

function loadInputs(){['habit','routine','guess'].forEach(k=>$(k).value=S[k]||'');[['pCue','cue'],['pAct','act'],['pRew','reward']].forEach(([id,k])=>$(id).value=S.plan[k]||'');$('cTime').value=nowTime()}
function switchTo(h){S=h;ALL.cur=h.id;sel='';bef=0;aft=0;akey='';save();loadInputs();drawBef();render();show(S.run?1:0)}
const withHabit=(h,fn)=>{const t=S;S=h;try{return fn()}finally{S=t}};
const cnt=h=>h.recs.filter(r=>r.result).length;
function drawHabits(){
 $('habits').innerHTML=ALL.list.map(h=>`<button class="chip" aria-pressed="${h.id===S.id}" data-h="${h.id}">${esc(h.habit||'未命名習慣')} ${cnt(h)}筆${h.run?' ・進行中':''}</button>`).join('')+'<button class="chip add" data-add="1">+ 新增習慣</button>';
}
$('habits').onclick=e=>{
 if(e.target.closest('[data-add]')){const h=newHabit();ALL.list.push(h);switchTo(h);show(0);return}
 const b=e.target.closest('[data-h]');if(b){const h=ALL.list.find(x=>String(x.id)===b.dataset.h);if(h&&h!==S)switchTo(h)}
};
$('delHabit').onclick=()=>{
 const n=(S.habit||'').trim()||'刪除',h=S;
 ask({title:'完全刪除這個習慣',body:'將永久刪除「'+(S.habit||'未命名習慣')+'」和它的 '+h.recs.length+' 筆記錄、計畫,無法復原。',need:n,ok:'完全刪除',onOk:()=>{
  ALL.list=ALL.list.filter(x=>x.id!==h.id);if(!ALL.list.length)ALL.list.push(newHabit());
  switchTo(ALL.list[0]);show(0);toast('已刪除')}});
};
function drawOv(){
 $('ov').innerHTML=ALL.list.map(h=>{
  const g=withHabit(h,goodRewards),c=withHabit(h,strongCues),n=cnt(h);
  const note=!n?'尚無記錄':[g.length?'有效獎勵:'+g.map(esc).join('、'):'獎勵待確認',c.length?'提示:'+c.map(x=>esc(x[1])).join('、'):''].filter(Boolean).join(' ・ ');
  return `<div class="ov"><b>${esc(h.habit||'未命名習慣')}</b> <span class="sub">${n} 筆</span><br><span class="sub">${note}</span></div>`}).join('');
}
function render(){drawHabits();drawOv();drawPre();drawRewChips();drawTabs();drawActive();drawRev();drawPlan()}
drawBef();render();show(S.run?1:0);
setInterval(()=>{if(S.run)drawActive()},1000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
